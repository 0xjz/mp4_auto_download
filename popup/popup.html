<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto MP4 Downloader</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #666;
      --bg: #fff;
      --border: #ddd;
      --accent: #1a7f37;
      --fail: #c0362c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6e6e6;
        --muted: #9aa0a6;
        --bg: #202124;
        --border: #3c4043;
        --accent: #4ade80;
        --fail: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--fg);
      background: var(--bg);
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    label { color: var(--muted); }

    /* toggle */
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--border); border-radius: 24px; transition: .2s;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(20px); }

    input[type="text"] {
      width: 150px;
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
    }
    .hint { font-size: 11px; color: var(--muted); margin: -6px 0 12px; }

    h2 {
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 5px 0; border-top: 1px solid var(--border);
    }
    .fname {
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .state { font-size: 11px; flex-shrink: 0; }
    .state.complete { color: var(--accent); }
    .state.failed { color: var(--fail); }
    .state.in_progress { color: var(--muted); }
    .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>Auto MP4 Downloader</h1>

  <div class="row">
    <label for="enabled">자동 저장 활성화</label>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <label for="subfolder">저장 서브폴더</label>
    <input type="text" id="subfolder" placeholder="AutoMP4" />
  </div>
  <div class="hint">Downloads/&lt;서브폴더&gt;/ 에 저장됩니다.</div>

  <h2>최근 다운로드</h2>
  <ul id="recent"></ul>

  <script src="popup.js"></script>
</body>
</html>
